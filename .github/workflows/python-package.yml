# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

permissions:
  contents: read

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main", "release/*" ]

jobs:
  teams-api-metadata-changes:
    name: Detect MSTeams metadata-relevant changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      base-ref: ${{ steps.changed.outputs.base-ref }}
    steps:
    - name: Checkout repository with full history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - id: changed
      name: Check changed paths
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BASE_SHA: ${{ github.event.before }}
      shell: bash
      run: |
        base_ref="$PR_BASE_SHA"
        if [[ -z "$base_ref" ]]; then
          base_ref="$PUSH_BASE_SHA"
        fi
        if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if git diff --quiet "$base_ref" "$GITHUB_SHA" -- \
          libraries/microsoft-agents-hosting-msteams/microsoft_agents/hosting/msteams \
          libraries/microsoft-agents-hosting-msteams/setup.py \
          libraries/microsoft-agents-hosting-msteams/teams-api-usage-manifest.json \
          libraries/microsoft-agents-hosting-msteams/config/teams-capabilities.yaml; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
        echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"

  teams-api-metadata:
    name: Validate Teams API metadata accuracy
    needs: teams-api-metadata-changes
    if: ${{ needs.teams-api-metadata-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with full history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/teams-api-drift/requirements.txt
    - name: Install Teams API drift tooling
      run: python -m pip install -r scripts/teams-api-drift/requirements.txt
    - name: Validate usage and capability metadata
      env:
        BASE_REF: ${{ needs.teams-api-metadata-changes.outputs.base-ref }}
      run: >-
        python scripts/teams-api-drift/teams-api-drift.py verify-usage
        --base-ref "$BASE_REF"

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 black build setuptools-git-versioning
        if [ -f dev_dependencies.txt ]; then pip install -r dev_dependencies.txt; fi
    - name: Check format with black
      run: |
        # stop the build if black raises an issue
        black libraries --check
    - name: Lint with flake8
      run: |
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --show-source --statistics
    - name: Set package version
      run: |
        cd ./versioning
        version=$(setuptools-git-versioning)
        echo "PackageVersion=$version" >> $GITHUB_ENV
        echo "Package version set to: $version"
    - name: Build packages
      run: |
        mkdir -p dist
        for dir in libraries/*; do
          if [ -f "$dir/pyproject.toml" ]; then
            (cd "$dir" && python -m build --outdir ../../dist)
          fi
        done
    - name: Install wheels
      run: |
        python -m pip install ./dist/microsoft_agents_activity*.whl
        python -m pip install ./dist/microsoft_agents_hosting_core*.whl
        python -m pip install ./dist/microsoft_agents_authentication_msal*.whl
        python -m pip install ./dist/microsoft_agents_authentication_entra_auth_sidecar*.whl
        python -m pip install ./dist/microsoft_agents_copilotstudio_client*.whl
        python -m pip install ./dist/microsoft_agents_hosting_aiohttp*.whl
        python -m pip install ./dist/microsoft_agents_hosting_dialogs*.whl
        if python -c "import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)"; then
          python -m pip install ./dist/microsoft_agents_hosting_msteams*.whl
        else
          echo "Skipping microsoft_agents_hosting_msteams: requires Python 3.11+"
        fi
        if python -c "import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)"; then
          python -m pip install ./dist/microsoft_agents_hosting_teams*.whl
        else
          echo "Skipping microsoft_agents_hosting_teams: requires Python 3.12+"
        fi
        python -m pip install ./dist/microsoft_agents_hosting_slack*.whl
        python -m pip install ./dist/microsoft_agents_hosting_fastapi*.whl
        python -m pip install ./dist/microsoft_agents_storage_blob*.whl
        python -m pip install ./dist/microsoft_agents_storage_cosmos*.whl
        python -m pip install ./dist/microsoft_agents_testing*.whl
    - name: Test with pytest
      run: |
        pytest -W "ignore:SelectableGroups dict interface is deprecated. Use select.:DeprecationWarning"
