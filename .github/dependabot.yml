version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/**/*"
    groups:
      python:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
