[mypy]
python_version = 3.11
strict = True
follow_imports = silent
no_site_packages = False
warn_unused_ignores = True
show_error_codes = True

# Analyze imported signatures, but do not impose strict checks on SDK implementation.
# Missing upstream imports remain errors in the explicit contract module.

[mypy-msgraph.*,msgraph_core.*,kiota_abstractions.*,azure.*,aiohttp.*,httpx.*,cryptography.*]
follow_imports = skip

# Teams wheels contain inline annotations but do not ship py.typed. Analyze those
# sources explicitly so contracts cannot silently degrade to Any.
[mypy-microsoft_teams.*]
follow_untyped_imports = True
